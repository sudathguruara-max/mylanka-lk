<!DOCTYPE html>
<html lang="si">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyLanka.lk - Sri Lanka's Marketplace</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#f5f5f5}
.header{background:#fff;padding:12px 15px;position:sticky;top:0;z-index:100;box-shadow:0 1px 5px rgba(0,0,0,.1)}
.logo{font-size:28px;font-weight:800;color:#000}.logo span{color:#ff6a00}
.search-box{background:#f0f2f5;border-radius:25px;display:flex;align-items:center;padding:12px 18px;margin-top:12px}
.search-box input{border:none;background:transparent;width:100%;outline:none;font-size:15px;margin-left:10px}
.banner-wrap{margin:15px;border-radius:20px;overflow:hidden;position:relative;height:170px;background:#000}
.banner-slide{position:absolute;width:100%;height:100%;display:none;align-items:center;padding:20px;color:#fff;background:linear-gradient(135deg,#ff8c00 0%,#ffbe0b 100%)}
.banner-slide.active{display:flex;animation:fade.5s}
.banner-slide img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;z-index:1}
.banner-overlay{position:absolute;top:0;left:0;width:100%;height:100%;background:linear-gradient(90deg,rgba(0,0,0,.6) 0%,rgba(0,0,0,.1) 100%);z-index:2}
.banner-text{position:relative;z-index:3}
.banner-text h2{font-size:22px;font-weight:800;line-height:1.2}
.banner-text button{margin-top:12px;background:#fff;color:#d35400;border:none;padding:8px 18px;border-radius:20px;font-weight:700}
.dots{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:4}
.dot{width:8px;height:8px;border-radius:50%;background:rgba(255,255,255,.5)}.dot.active{background:#fff;width:20px;border-radius:10px}
@keyframes fade{from{opacity:0}to{opacity:1}}
.categories{padding:15px}.cat-title{font-size:18px;font-weight:700}
.cat-list{display:flex;gap:12px;overflow-x:auto;margin-top:12px;padding-bottom:5px}.cat-list::-webkit-scrollbar{display:none}
.cat-item{text-align:center;min-width:65px;cursor:pointer}
.cat-icon{width:60px;height:60px;background:#fff;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:28px;box-shadow:0 2px 8px rgba(0,0,0,.06)}
.cat-item.active.cat-icon{border:2px solid #ff6a00}.cat-item.active p{color:#ff6a00;font-weight:700}
.cat-item p{font-size:13px;margin-top:6px}
.products{padding:0 15px 90px}.sec-title{font-size:18px;font-weight:700;margin-bottom:12px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 2px 8px rgba(0,0,0,.06);cursor:pointer}
.card-img{height:140px;background:#eee}.card-img img{width:100%;height:100%;object-fit:cover}
.card-body{padding:10px}.card-title{font-size:13px;font-weight:600;height:34px;overflow:hidden}.card-price{color:#ff6a00;font-weight:800;margin-top:6px;font-size:14px}
.add-btn{position:fixed;bottom:25px;right:20px;width:60px;height:60px;background:#ff6a00;border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-size:32px;box-shadow:0 4px 15px rgba(255,106,0,.4);cursor:pointer;z-index:90;border:none}
.modal{position:fixed;top:0;left:0;width:100%;height:100%;background:#fff;z-index:200;display:none;overflow-y:auto}.modal.active{display:block}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:12px 15px;background:#fff;border-bottom:1px solid #eee;position:sticky;top:0}
.modal-img{width:100%;height:300px;background:#f0f0f0}.modal-img img{width:100%;height:100%;object-fit:contain}
.modal-content{padding:15px}.price{font-size:22px;font-weight:800;color:#ff6a00}.title{font-size:16px;font-weight:700;margin:8px 0}.loc{color:#777;font-size:13px}.desc-title{font-weight:700;margin-top:18px}.desc{margin-top:6px;color:#444;font-size:14px;line-height:1.5}
.seller-box{margin-top:20px;padding-top:15px;border-top:1px solid #eee}.seller-phone{font-size:18px;font-weight:800;margin-top:5px}
.action-row{display:flex;gap:10px;margin-top:18px}.btn-call{flex:1;background:#00a884;color:#fff;border:none;padding:14px;border-radius:25px;font-weight:700}.btn-wa{flex:1;background:#25d366;color:#fff;border:none;padding:14px;border-radius:25px;font-weight:700}
.x-btn{width:36px;height:36px;border-radius:50%;background:#f0f0f0;display:flex;align-items:center;justify-content:center;cursor:pointer;border:none;font-size:18px}
</style>
</head>
<body>
<div class="header">
<div class="logo">MyLanka<span>.lk</span></div>
<div class="search-box">🔍<input type="text" placeholder="Search bikes, cars..." id="searchInput"></div>
</div>

<div class="banner-wrap" id="bannerWrap">
<div class="banner-slide active" id="slide0"><img id="bimg0" src=""><div class="banner-overlay"></div><div class="banner-text"><h2>MEGA SALE<br>Up to 60% OFF</h2><button>Shop Now →</button></div></div>
<div class="banner-slide" id="slide1"><img id="bimg1" src=""><div class="banner-overlay"></div><div class="banner-text"><h2>New Bikes<br>Finance Available</h2><button>View →</button></div></div>
<div class="banner-slide" id="slide2"><img id="bimg2" src=""><div class="banner-overlay"></div><div class="banner-text"><h2>ikman.lk Style<br>Fast Selling</h2><button>Explore →</button></div></div>
<div class="dots"><div class="dot active"></div><div class="dot"></div><div class="dot"></div></div>
</div>

<div class="categories">
<div class="cat-title">Categories</div>
<div class="cat-list">
<div class="cat-item active" onclick="filterCat('all',this)"><div class="cat-icon">🏠</div><p>All</p></div>
<div class="cat-item" onclick="filterCat('vehicle',this)"><div class="cat-icon">🏍️</div><p>Vehicle</p></div>
<div class="cat-item" onclick="filterCat('electronics',this)"><div class="cat-icon">📱</div><p>Electronics</p></div>
<div class="cat-item" onclick="filterCat('fashion',this)"><div class="cat-icon">👕</div><p>Fashion</p></div>
<div class="cat-item" onclick="filterCat('home',this)"><div class="cat-icon">🏡</div><p>Home</p></div>
</div>
</div>

<div class="products"><div class="sec-title">Fresh Recommendations</div><div class="grid" id="productGrid"></div></div>
<button class="add-btn" onclick="alert('Post Ad - Coming Soon!')">+</button>

<div class="modal" id="productModal">
<div class="modal-header"><div onclick="closeModal()" class="x-btn">←</div><div class="x-btn" onclick="closeModal()">✕</div></div>
<div class="modal-img"><img id="mImg" src=""></div>
<div class="modal-content">
<div class="price" id="mPrice"></div><div class="title" id="mTitle"></div><div class="loc" id="mLoc"></div>
<div class="desc-title">Description</div><div class="desc" id="mDesc"></div>
<div class="seller-box"><div class="desc-title">Seller Information</div><div class="seller-phone" id="mPhone"></div>
<div class="action-row"><button class="btn-call" id="mCall">Call Now</button><button class="btn-wa" id="mWa">WhatsApp</button></div></div>
</div>
</div>

<script>
const products=[
{title:"Recondition bikes store ( FZ bike )",price:"LKR 225,000",location:"Chanaka motors / ගම්පහ",desc:"Recondition, Finance 15 min - Chanaka Motors",phone:"0769168955",img:"https://images.unsplash.com/photo-1558981806-ec527fa84c39?w=500",cat:"vehicle"},
{title:"Bajaj Pulser ns 200 bike - 2026 brand new",price:"LKR 535,000",location:"Kurunegala",desc:"Brand new with warranty",phone:"0771234567",img:"https://images.unsplash.com/photo-1568772585407-9361f9bf3a87?w=500",cat:"vehicle"},
{title:"iPhone 14 Pro Max 256GB",price:"LKR 385,000",location:"Colombo",desc:"Like new condition",phone:"0777654321",img:"https://images.unsplash.com/photo-1592750475338-74b7b21085ab?w=500",cat:"electronics"}
];
let currentSlide=0;
function tryLoad(imgEl, names){
  let i=0;
  function next(){ if(i>=names.length) return; imgEl.onerror=()=>{i++;next();}; imgEl.src=names[i]; }
  next();
}
tryLoad(document.getElementById('bimg0'),['banner1.jpg','Banner1.jpg']);
tryLoad(document.getElementById('bimg1'),['banner2.jpg','Banner2.jpg']);
tryLoad(document.getElementById('bimg2'),['banner3.jpg','Banner3.jpg']);
setInterval(()=>{
  document.querySelectorAll('.banner-slide').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.dot').forEach(d=>d.classList.remove('active'));
  currentSlide=(currentSlide+1)%3;
  document.getElementById('slide'+currentSlide).classList.add('active');
  document.querySelectorAll('.dot')[currentSlide].classList.add('active');
},3000);
function render(list){
 const grid=document.getElementById('productGrid'); grid.innerHTML='';
 list.forEach((p,idx)=>{ grid.innerHTML+=`<div class="card" onclick="openModal(${idx})"><div class="card-img"><img src="${p.img}"></div><div class="card-body"><div class="card-title">${p.title}</div><div class="card-price">${p.price}</div></div></div>`; });
}
function openModal(i){
 const p=products[i];
 document.getElementById('mImg').src=p.img;
 document.getElementById('mPrice').innerText=p.price;
 document.getElementById('mTitle').innerText=p.title;
 document.getElementById('mLoc').innerText='📍 '+p.location;
 document.getElementById('mDesc').innerText=p.desc;
 document.getElementById('mPhone').innerText=p.phone;
 document.getElementById('mCall').onclick=()=>{window.location.href='tel:'+p.phone};
 document.getElementById('mWa').onclick=()=>{let num=p.phone.startsWith('0')?'94'+p.phone.substring(1):p.phone; window.open('https://wa.me/'+num,'_blank')};
 document.getElementById('productModal').classList.add('active');
}
function closeModal(){document.getElementById('productModal').classList.remove('active')}
function filterCat(c,el){
 document.querySelectorAll('.cat-item').forEach(e=>e.classList.remove('active'));
 el.classList.add('active');
 const banner=document.getElementById('bannerWrap');
 if(c==='all'){banner.style.display='block'; render(products);}
 else{banner.style.display='none'; render(products.filter(p=>p.cat===c));}
}
document.getElementById('searchInput').addEventListener('input',e=>{
 const s=e.target.value.toLowerCase();
 render(products.filter(p=>p.title.toLowerCase().includes(s)));
 document.getElementById('bannerWrap').style.display=s? 'none':'block';
});
render(products);
</script>
</body>
</html>
