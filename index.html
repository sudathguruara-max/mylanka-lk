<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MyLanka.lk</title>
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<style>
body{font-family:system-ui;background:#f8f9fa}
.premium-card{border-radius:20px;background:#fff;box-shadow:0 2px 12px rgba(0,0,0,0.06);border:1px solid #f0f0f0;position:relative;overflow:hidden}
.badge{position:absolute;top:10px;left:10px;padding:3px 8px;border-radius:8px;font-size:9px;font-weight:900;z-index:2}
.badge-bestseller{background:#d4e8a8;color:#4a6a1a}.badge-toppick{background:#ffe0b2;color:#e65100}.badge-new{background:#d6f0d6;color:#2e7d32}.badge-local{background:#d4e8a8;color:#33691e}
.cat-icon{width:66px;height:66px;border-radius:18px;display:grid;place-items:center;font-size:28px}
@keyframes drop{0%{transform:translateY(-300px) scale(0.5);opacity:0}60%{transform:translateY(30px) scale(1.1);opacity:1}80%{transform:translateY(-10px) scale(0.95)}100%{transform:translateY(0) scale(1);opacity:1}}
@keyframes fadeOut{0%{opacity:1}100%{opacity:0;visibility:hidden}}
.logo-drop{animation:drop 1.2s cubic-bezier(0.34,1.56,0.64,1) forwards}
.splash-fade{animation:fadeOut 0.6s ease-in forwards}
</style>
</head>
<body>
<div id="splash" class="fixed inset-0 bg-white z-[9999] flex flex-col items-center justify-center"><img src="logo.jpg" class="w-[300px] max-w-[80vw] logo-drop" onerror="this.src='https://via.placeholder.com/300x150?text=MyLanka.lk'"><p class="mt-4 text-[11px] font-black text-[#ff6a00] tracking-[4px]">CLASSIFIED ADS • MARKETPLACE</p><div class="mt-6 w-7 h-7 border-[3px] border-[#ff6a00] border-t-transparent rounded-full animate-spin"></div></div>
<header class="bg-white sticky top-0 z-40 shadow-sm"><div class="max-w-[480px] mx-auto px-4 h-[56px] flex items-center justify-between"><h1 class="text-[24px] font-black">MyLanka<span class="text-[#ff6a00]">.lk</span></h1><div class="flex gap-3 text-[18px]"><i class="fa-regular fa-heart"></i><i class="fa fa-shopping-cart"></i><span id="cartCount" class="bg-[#ff6a00] text-white text-[9px] w-[15px] h-[15px] rounded-full grid place-items-center">0</span></div></div><div class="max-w-[480px] mx-auto px-4 pb-3"><div class="bg-[#f0f2f5] rounded-full flex items-center px-4 py-3 gap-3"><i class="fa fa-search text-[#00b578]"></i><input id="searchInput" placeholder="Search..." class="flex-1 bg-transparent outline-none text-[13px]" oninput="doSearch(this.value)"><i class="fa fa-camera text-[#ff6a00]"></i></div></div></header>
<div class="max-w-[480px] mx-auto w-full px-4 mt-3 overflow-hidden"><div id="bannerWrapper" class="relative rounded-[22px] overflow-hidden h-[140px]"><div id="bannerTrack" class="flex h-full transition-transform duration-500" style="transform:translateX(0)"><div class="min-w-full h-full p-5 text-white flex justify-between items-center" style="background:linear-gradient(100deg,#ff8a00 0%,#ffb347 35%,#7ac74f 100%)"><div><h2 class="text-[20px] font-black">MEGA SALE<br>Up to 60% OFF</h2><p class="text-[10px] font-bold mt-1">Free Delivery</p><button class="mt-2 bg-white text-[#e65100] px-4 py-1.5 rounded-full text-[11px] font-black">Shop Now →</button></div><div class="text-[55px]">🛍️</div></div><div class="min-w-full h-full p-5 text-white flex justify-between items-center" style="background:linear-gradient(100deg,#1976d2 0%,#64b5f6 50%,#00b578 100%)"><div><h2 class="text-[20px] font-black">NEW ARRIVALS<br>Trending Now</h2><p class="text-[10px] font-bold mt-1">Electronics • Fashion</p><button class="mt-2 bg-white text-[#1976d2] px-4 py-1.5 rounded-full text-[11px] font-black">Explore →</button></div><div class="text-[55px]">⚡</div></div><div class="min-w-full h-full p-5 text-white flex justify-between items-center" style="background:linear-gradient(100deg,#e91e63 0%,#f48fb1 50%,#ff8a00 100%)"><div><h2 class="text-[20px] font-black">FASHION WEEK<br>30% OFF</h2><p class="text-[10px] font-bold mt-1">Beauty • Groceries</p><button class="mt-2 bg-white text-[#e91e63] px-4 py-1.5 rounded-full text-[11px] font-black">Shop Now →</button></div><div class="text-[55px]">👗</div></div></div></div><div id="bannerDots" class="flex justify-center gap-1.5 mt-3"></div></div><div class="max-w-[480px] mx-auto w-full px-4 mt-5"><div class="flex justify-between mb-3"><h3 class="font-black text-[16px]">Categories</h3></div><div id="catBar" class="flex gap-3 overflow-x-auto pb-2"><button onclick="filterCat('all')" class="flex flex-col items-center min-w-[70px]"><div class="cat-icon bg-gray-100">🏠</div><span class="text-[10px] font-bold">All</span></button><button onclick="filterCat('electronics')" class="flex flex-col items-center min-w-[70px]"><div class="cat-icon bg-[#fff3e0]">📱</div><span class="text-[10px] font-bold">Electronics</span></button><button onclick="filterCat('fashion')" class="flex flex-col items-center min-w-[70px]"><div class="cat-icon bg-[#e8f5e9]">👕</div><span class="text-[10px] font-bold">Fashion</span></button><button onclick="filterCat('home')" class="flex flex-col items-center min-w-[70px]"><div class="cat-icon bg-[#fff8e1]">🍳</div><span class="text-[10px] font-bold">Home</span></button><button onclick="filterCat('beauty')" class="flex flex-col items-center min-w-[70px]"><div class="cat-icon bg-[#fce4ec]">💄</div><span class="text-[10px] font-bold">Beauty</span></button><button onclick="filterCat('grocery')" class="flex flex-col items-center min-w-[70px]"><div class="cat-icon bg-[#fff3e0]">🧺</div><span class="text-[10px] font-bold">Groceries</span></button></div></div>
<div class="max-w-[480px] mx-auto w-full px-4 mt-5 pb-[90px]"><div id="grid" class="grid grid-cols-2 gap-3"></div></div>
<div class="fixed bottom-0 left-0 right-0 bg-white border-t rounded-t-[20px] z-50"><div class="max-w-[480px] mx-auto flex justify-around py-2.5"><button class="flex flex-col items-center text-[#ff6a00]"><span class="text-[10px] font-black">Home</span></button><button class="flex flex-col items-center text-gray-400"><span class="text-[10px]">Categories</span></button><button onclick="openCart()" class="flex flex-col items-center text-gray-400"><span class="text-[10px]">Cart</span></button><button onclick="openLogin()" class="flex flex-col items-center text-gray-400"><span class="text-[10px]">Account</span></button></div></div>
<button onclick="openPostModal()" class="fixed bottom-[80px] right-4 bg-[#ff6a00] text-white w-[56px] h-[56px] rounded-full shadow-lg text-[28px] font-bold z-40">+</button>

<div id="detailModal" class="fixed inset-0 bg-white z-[80] hidden overflow-y-auto"><div class="max-w-[480px] mx-auto"><div class="p-4 flex justify-between"><button onclick="closeDetail()" class="w-9 h-9 bg-gray-100 rounded-full">←</button><button onclick="closeDetail()" class="w-9 h-9 bg-gray-100 rounded-full">X</button></div><img id="dImage" class="w-full h-[300px] object-contain"><div id="dMoreImgs" class="flex gap-2 p-3"></div><div class="p-4"><h1 id="dTitle" class="font-black text-[18px]"></h1><p id="dPrice" class="text-[22px] font-black text-[#e53900] mt-2"></p><p id="dLocation" class="text-[12px] text-gray-500"></p><div id="dPhoneBox" class="mt-3 bg-green-50 border-2 border-green-200 rounded-xl p-3 hidden"><a id="dPhone" class="font-black text-green-700 text-[16px]"></a><div class="grid grid-cols-2 gap-2 mt-2"><a id="dCallBtn" href="#" class="bg-green-600 text-white rounded-full py-2.5 text-center font-bold">Call Now</a><a id="dWhatsappBtn" href="#" class="bg-[#25D366] text-white rounded-full py-2.5 text-center font-bold">WhatsApp</a></div></div><p id="dDesc" class="text-[13px] bg-gray-50 p-3 rounded-xl mt-3"></p><button id="deleteBtn" onclick="deleteMyAd()" class="hidden w-full mt-2 h-[44px] bg-red-50 text-red-600 border-2 border-red-200 rounded-full font-bold">Delete My Ad</button></div></div></div>

<div id="postModal" class="fixed inset-0 bg-black/60 z-[90] hidden items-center justify-center p-3"><div class="bg-white w-full max-w-[480px] rounded-[20px] max-h-[90vh] overflow-y-auto"><div class="p-4 border-b flex justify-between"><h3 class="font-black">Post Ad - Premium</h3><button onclick="closePostModal()" class="w-8 h-8 bg-gray-100 rounded-full">X</button></div><div class="p-4 space-y-3"><select id="pCategory" class="w-full border p-3 rounded-xl bg-gray-50 text-[13px]"><option value="electronics">📱 Electronics</option><option value="fashion">👕 Fashion</option><option value="home">🍳 Home & Kitchen</option><option value="beauty">💄 Beauty</option><option value="grocery">🧺 Groceries</option></select><input id="pTitle" placeholder="Title *" class="w-full border p-3 rounded-xl text-[13px]"><input id="pPrice" type="number" placeholder="Price Rs *" class="w-full border p-3 rounded-xl text-[13px]"><input id="pLocation" placeholder="Location *" class="w-full border p-3 rounded-xl text-[13px]"><input id="pPhone" placeholder="Phone 07XXXXXXXX *" class="w-full border-2 border-green-300 p-3 rounded-xl text-[13px] bg-green-50"><textarea id="pDesc" placeholder="Description" class="w-full border p-3 rounded-xl text-[13px]"></textarea><div class="border-2 border-dashed border-green-300 rounded-2xl p-4 text-center bg-green-50/50"><input id="pImages" type="file" accept="image/*" multiple hidden><button onclick="document.getElementById('pImages').click()" class="w-full h-[44px] bg-white border-2 border-green-600 text-green-700 rounded-xl font-bold text-[13px]">📷 Choose Photos (max 3)</button><div id="imgPreview" class="grid grid-cols-3 gap-2 mt-3 hidden"></div><p id="imgCount" class="text-[11px] text-green-600 font-bold mt-2 hidden"></p></div><button onclick="submitAd()" id="submitBtn" class="w-full h-[48px] bg-[#00b578] text-white font-bold rounded-xl">✅ Post Ad - Free</button><p id="postError" class="text-[11px] text-red-500 text-center"></p></div></div></div>

<div id="loginModal" class="fixed inset-0 bg-white z-[90] hidden flex-col items-center justify-center p-6"><div class="w-full max-w-[360px] text-center"><h2 class="font-black text-[22px]">MyLanka.lk</h2><button onclick="googleLogin()" class="w-full mt-6 h-[48px] border-2 rounded-xl font-bold">Continue with Google</button><button onclick="closeLogin()" class="mt-4 text-[12px] underline text-gray-400">Close</button><p id="error" class="text-xs text-red-500 mt-3"></p></div></div>
<div id="cartModal" class="fixed inset-0 bg-black/60 z-[90] hidden"><div class="bg-white w-full max-w-[380px] h-full ml-auto flex flex-col"><div class="p-4 border-b flex justify-between"><h3 class="font-black">Cart (<span id="cartCount2">0</span>)</h3><button onclick="closeCart()">X</button></div><div id="cartItems" class="flex-1 overflow-y-auto p-4"></div><div class="p-4 border-t"><div class="flex justify-between font-black"><span>Subtotal</span><span id="cartSubtotal">Rs.0</span></div><button onclick="checkout()" class="w-full mt-3 h-[48px] bg-[#ff6a00] text-white font-bold rounded-xl">Checkout</button></div></div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import {getAuth,GoogleAuthProvider,signInWithPopup,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import {getFirestore,collection,addDoc,query,orderBy,onSnapshot,deleteDoc,doc} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";
const cfg={apiKey:"AIzaSyBCTh5NJgnhcXec_FMfpvFOuccBLxpHfxQ",authDomain:"mylanka-lk.firebaseapp.com",projectId:"mylanka-lk",storageBucket:"mylanka-lk.firebasestorage.app",messagingSenderId:"403802424795",appId:"1:403802424795:web:6736366578096ff129d3fe"};
const app=initializeApp(cfg);const auth=getAuth(app);const db=getFirestore(app);
let allProducts=[],cart=JSON.parse(localStorage.getItem('mycart')||'[]'),currentFilter='all',currentSearch='',selectedBase64=[],currentDeleteId=null;
setTimeout(()=>{const s=document.getElementById('splash');s.classList.add('splash-fade');setTimeout(()=>s.style.display='none',600);},2200);
let currentBanner=0;const totalBanners=3;const track=document.getElementById('bannerTrack');const dotsContainer=document.getElementById('bannerDots');
function createDots(){if(!dotsContainer)return;dotsContainer.innerHTML='';for(let i=0;i<totalBanners;i++){let d=document.createElement('div');d.className='w-2 h-2 rounded-full '+(i===0?'bg-[#ff6a00] w-4':'bg-gray-300');d.onclick=()=>goToBanner(i);dotsContainer.appendChild(d);}}
function updateDots(){[...dotsContainer.children].forEach((d,i)=>{d.className='w-2 h-2 rounded-full '+(i===currentBanner?'bg-[#ff6a00] w-4':'bg-gray-300');});}
window.goToBanner=(n)=>{currentBanner=n;track.style.transform=`translateX(-${currentBanner*100}%)`;updateDots();}
setInterval(()=>{currentBanner=(currentBanner+1)%totalBanners;goToBanner(currentBanner);},4000);createDots();
let startX=0;track.addEventListener('touchstart',e=>{startX=e.touches[0].clientX;},{passive:true});track.addEventListener('touchend',e=>{let diff=startX-e.changedTouches[0].clientX;if(Math.abs(diff)>50){if(diff>0)currentBanner=(currentBanner+1)%totalBanners;else currentBanner=(currentBanner-1+totalBanners)%totalBanners;goToBanner(currentBanner);}},{passive:true});
const q=query(collection(db,"products"),orderBy("createdAt","desc"));
onSnapshot(q,snap=>{allProducts=snap.docs.map(d=>({id:d.id,...d.data()}));render();updateCart();});
onAuthStateChanged(auth,u=>{if(u)closeLogin();});
function render(){let list=[...allProducts];if(currentFilter!=='all')list=list.filter(p=>p.category===currentFilter);if(currentSearch)list=list.filter(p=>(p.title+' '+(p.location||'')).toLowerCase().includes(currentSearch));const grid=document.getElementById('grid');if(list.length===0){grid.innerHTML='<div class="col-span-2 text-center py-12 bg-white rounded-[20px] border"><p class="font-black">No Ads Yet</p><button onclick="openPostModal()" class="mt-3 bg-[#ff6a00] text-white px-5 py-2 rounded-full text-[12px] font-black">+ Post First Ad</button></div>';return;}const badges=[{t:'BESTSELLER',c:'badge-bestseller'},{t:'TOP PICK',c:'badge-toppick'},{t:'NEW',c:'badge-new'},{t:'LOCAL',c:'badge-local'}];const ratings=['4.8 (1.2k)','4.9 (980)','4.6 (850)','4.7 (620)'];grid.innerHTML=list.map((p,i)=>{const b=badges[i%4];const r=ratings[i%4];const oldP=Math.round(p.price*1.4);return `<div onclick="openDetail('${p.id}')" class="premium-card p-3 cursor-pointer"><span class="badge ${b.c}">${b.t}</span><img src="${p.image}" class="w-full h-[120px] object-contain mt-3"><p class="text-[12px] font-bold mt-2 h-[32px] leading-[1.2]">${p.title}</p><div class="flex justify-center gap-1 mt-1"><span class="text-[#ffb400] text-[11px]">★★★★★</span><span class="text-[11px] font-bold">${r}</span></div><div class="flex justify-between items-end mt-2"><div><p class="text-[#e53900] font-black text-[13px]">LKR ${Number(p.price).toLocaleString()}</p><p class="text-[10px] line-through text-gray-400">LKR ${oldP.toLocaleString()}</p></div><div class="w-[30px] h-[30px] bg-[#00b578] text-white rounded-full grid place-items-center font-bold">+</div></div></div>`;}).join('');}
window.filterCat=c=>{currentFilter=c;render();};window.doSearch=v=>{currentSearch=v.toLowerCase().trim();render();};
const pImagesInput=document.getElementById('pImages');const previewEl=document.getElementById('imgPreview');const countEl=document.getElementById('imgCount');
pImagesInput.addEventListener('change',async(e)=>{let files=Array.from(e.target.files).slice(0,3);selectedBase64=[];previewEl.innerHTML='';for(let f of files){let b64=await toResized(f);selectedBase64.push(b64);previewEl.innerHTML+=`<img src="${b64}" class="w-full h-[70px] object-cover rounded-xl border-2">`;}previewEl.classList.remove('hidden');countEl.innerText=selectedBase64.length+' Photos Ready ✅ No Billing!';countEl.classList.remove('hidden');});
function toResized(file){return new Promise(res=>{const url=URL.createObjectURL(file);const img=new Image();img.onload=()=>{const c=document.createElement('canvas');let w=img.width,h=img.height;const max=600;if(w>max){h=h*max/w;w=max;}if(h>max){w=w*max/h;h=max;}c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',0.5));};img.src=url;});}
window.openDetail=id=>{let p=allProducts.find(x=>x.id===id);document.getElementById('dImage').src=p.image;document.getElementById('dTitle').innerText=p.title;document.getElementById('dPrice').innerText='LKR '+Number(p.price).toLocaleString();document.getElementById('dLocation').innerText='📍 '+(p.location||'');document.getElementById('dDesc').innerText=p.description||p.title;if(p.phone){document.getElementById('dPhoneBox').classList.remove('hidden');document.getElementById('dPhone').innerText=p.phone;document.getElementById('dCallBtn').href='tel:'+p.phone;document.getElementById('dWhatsappBtn').href='https://wa.me/94'+p.phone.slice(-9);}document.getElementById('dMoreImgs').innerHTML=(p.images||[]).map(im=>`<img src="${im}" class="w-[60px] h-[60px] rounded-xl object-cover border-2" onclick="document.getElementById('dImage').src='${im}'">`).join('');currentDeleteId=p.id;const del=document.getElementById('deleteBtn');if(auth.currentUser&&p.user===auth.currentUser.uid)del.classList.remove('hidden');else del.classList.add('hidden');document.getElementById('detailModal').classList.remove('hidden');};
window.closeDetail=()=>document.getElementById('detailModal').classList.add('hidden');
window.deleteMyAd=async()=>{if(!currentDeleteId)return;if(!confirm('Delete?'))return;await deleteDoc(doc(db,"products",currentDeleteId));closeDetail();};
window.openPostModal=()=>{if(!auth.currentUser){openLogin();return;}document.getElementById('postModal').classList.remove('hidden');document.getElementById('postModal').classList.add('flex');};window.closePostModal=()=>{document.getElementById('postModal').classList.add('hidden');document.getElementById('postModal').classList.remove('flex');};
window.submitAd=async()=>{try{const title=document.getElementById('pTitle').value.trim();const price=document.getElementById('pPrice').value;const loc=document.getElementById('pLocation').value.trim();const phone=document.getElementById('pPhone').value.trim();const cat=document.getElementById('pCategory').value;const desc=document.getElementById('pDesc').value.trim();if(!title||!price||!loc||!phone){document.getElementById('postError').innerText='Fill all!';return;}if(selectedBase64.length===0){document.getElementById('postError').innerText='Choose photo!';return;}const btn=document.getElementById('submitBtn');btn.innerText='Posting...';btn.disabled=true;await addDoc(collection(db,"products"),{title,price:Number(price),location:loc,phone,category:cat,description:desc,image:selectedBase64[0],images:selectedBase64,createdAt:Date.now(),user:auth.currentUser.uid});alert('Posted! 🎉');closePostModal();btn.innerText='✅ Post Ad - Free';btn.disabled=false;document.getElementById('pTitle').value='';document.getElementById('pPrice').value='';document.getElementById('pLocation').value='';document.getElementById('pPhone').value='';document.getElementById('pDesc').value='';selectedBase64=[];previewEl.classList.add('hidden');countEl.classList.add('hidden');}catch(e){document.getElementById('postError').innerText=e.message;document.getElementById('submitBtn').innerText='✅ Post Ad - Free';document.getElementById('submitBtn').disabled=false;}};
window.openLogin=()=>{document.getElementById('loginModal').classList.remove('hidden');document.getElementById('loginModal').classList.add('flex');};window.closeLogin=()=>{document.getElementById('loginModal').classList.add('hidden');};window.googleLogin=async()=>{await signInWithPopup(auth,new GoogleAuthProvider());closeLogin();};
window.openCart=()=>document.getElementById('cartModal').classList.remove('hidden');window.closeCart=()=>document.getElementById('cartModal').classList.add('hidden');window.checkout=()=>{alert('Order Placed!');cart=[];localStorage.setItem('mycart','[]');updateCart();closeCart();};
window.updateCart=()=>{document.getElementById('cartCount').innerText=cart.reduce((s,i)=>s+i.qty,0);document.getElementById('cartCount2').innerText=cart.reduce((s,i)=>s+i.qty,0);document.getElementById('cartSubtotal').innerText='Rs.'+cart.reduce((s,i)=>s+i.price*i.qty,0).toLocaleString();document.getElementById('cartItems').innerHTML=cart.length===0?'<p class="text-center text-gray-400 mt-10 text-[12px]">Cart empty</p>':cart.map(i=>`<div class="flex gap-3 border-b pb-3 mb-3"><img src="${i.image}" class="w-[60px] h-[60px] rounded-xl object-cover"><div><p class="text-[12px] font-bold">${i.title}</p><p class="text-[12px] text-[#e53900] font-bold">Rs.${i.price} x ${i.qty}</p></div></div>`).join('');};
window.addToCart=id=>{let p=allProducts.find(x=>x.id===id);let it=cart.find(i=>i.id===id);if(it)it.qty++;else cart.push({id,title:p.title,price:p.price,image:p.image,qty:1});localStorage.setItem('mycart',JSON.stringify(cart));updateCart();openCart();};
</script>
</body>
</html>
